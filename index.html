<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Gestão Financeira</h1>
            <p>O que você deseja fazer hoje?</p>
        </header>

        <div class="menu-grid">
            <a href="ganhos.html" class="menu-card verde">💰 Lançar Ganho</a>
            <a href="gastos.html" class="menu-card vermelho">💸 Lançar Gasto</a>
            <a href="dashboard.html" class="menu-card azul">📊 Ver Dashboard</a>    
            
            <button onclick="sair()" class="menu-card cinza">🚪 Encerrar Sessão</button>
        </div>
    </main>
    <script type="module">
import { auth } from './firebase-config.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    }
});

window.sair = async () => {
    await signOut(auth);
    window.location.href = "login.html";
};
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado!', reg))
          .catch(err => console.log('Erro ao registrar SW', err));
        }
    </script>
</body>
</html>
